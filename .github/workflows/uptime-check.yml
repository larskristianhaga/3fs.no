name: "Uptime check"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  uptime:
    name: "Check sitemap pages"
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check all pages in sitemap
        run: |
          sitemap=$(curl -sfL --max-time 30 --retry 2 --retry-delay 10 "https://www.3fs.no/sitemap.xml") || {
            echo "::error::Could not fetch sitemap.xml"
            exit 1
          }
          urls=$(echo "$sitemap" | grep -o '<loc>[^<]*</loc>' | sed -e 's|<loc>||' -e 's|</loc>||')
          if [ -z "$urls" ]; then
            echo "::error::No URLs found in sitemap.xml"
            exit 1
          fi

          echo "Checking $(echo "$urls" | wc -l) URLs"
          failed=0
          for url in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 --retry 2 --retry-delay 10 "$url" || true)
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              failed=1
            fi
          done
          exit $failed
