name: "Uptime check"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  uptime:
    name: "Check sitemap pages"
    runs-on: ubuntu-26.04-arm
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check all pages in sitemap
        run: |
          sitemap=$(curl -sfL --max-time 30 --retry 2 --retry-delay 10 "$SITE_URL/sitemap.xml") || {
            echo "::error::Could not fetch sitemap.xml"
            exit 1
          }
          # The sitemap lists canonical URLs; swap in SITE_URL so we check the host actually serving the app
          urls=$(echo "$sitemap" | grep -o '<loc>[^<]*</loc>' | sed -e 's|<loc>||' -e 's|</loc>||' -e "s|^https\{0,1\}://[^/]*|$SITE_URL|")
          if [ -z "$urls" ]; then
            echo "::error::No URLs found in sitemap.xml"
            exit 1
          fi

          echo "Checking $(echo "$urls" | wc -l) URLs"
          failed=0
          for url in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 --retry 2 --retry-delay 10 "$url" || true)
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              failed=1
            fi
          done
          exit $failed

      - name: Check contact form email
        if: always()
        run: |
          # No -L: following a redirect would turn the POST into a GET
          code=$(curl -s -o response.json -w '%{http_code}' -X POST --max-time 30 --retry 2 --retry-delay 10 \
            "$SITE_URL/api/contact/health" || true)
          echo "Email health check -> $code"
          cat response.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::Email health check returned $code"
            exit 1
          fi
