name: "Check for broken links"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  link-checker:
    name: "Check broken links"
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check for broken links
        uses: ruzickap/action-my-broken-link-checker@5c84b4ee7ae993f10d8e5c7898ab669d4432f269 # 3.0.3
        with:
          url: ${{ vars.SITE_URL }}
          cmd_params: "--max-connections=1 --buffer-size=8192 --header='User-Agent:muffet' --timeout=30 --verbose --color=always"
