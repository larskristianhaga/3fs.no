name: "Check for broken links"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  link-checker:
    name: "Check broken links"
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check for broken links
        uses: ruzickap/action-my-broken-link-checker@973e61c81036a180b3df2c60360e03920b0dc5d3 # 3.1.0
        with:
          url: ${{ vars.SITE_URL }}
          cmd_params: "--max-connections=1 --buffer-size=8192 --header='User-Agent:muffet' --timeout=30 --verbose --color=always"
