name: "Auto-merge Dependabot PRs if Vercel build and tests pass"

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-and-set-auto-merge:
    name: "Approve and set PR to auto merge Dependabot PR"
    runs-on: ubuntu-24.04-arm
    if: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Log changes to version"
        run: echo "Version going from ${{ steps.metadata.outputs.previous-version }}, to ${{ steps.metadata.outputs.new-version }}"

      - name: "Approve the PR"
        run: gh pr review --approve "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set PR to auto merge with squash"
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
