name: "SEO audit"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 2 * *'

permissions:
  contents: read

jobs:
  unlighthouse:
    name: "Crawl site with Unlighthouse"
    # x64 runner: it ships with Google Chrome, which has no Linux ARM build
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      # Score budgets live in .github/unlighthouse.config.ts
      - name: Run Unlighthouse
        run: |
          npx --yes -p @unlighthouse/cli@0.19.1 unlighthouse-ci \
            --config-file .github/unlighthouse.config.ts \
            --output-path unlighthouse-report

      - name: Show results
        if: always() && hashFiles('unlighthouse-report/ci-result.json') != ''
        run: node .github/scripts/unlighthouse-summary.mjs unlighthouse-report
