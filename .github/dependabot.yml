version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: Europe/Oslo

  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: Europe/Oslo
