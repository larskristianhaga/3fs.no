version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: Europe/Oslo

  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: Europe/Oslo
